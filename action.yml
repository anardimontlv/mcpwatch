name: mcpwatch
description: Scan MCP configs for risky setups, and fail CI when a pinned MCP server's tools change (rug-pull radar).
branding: { icon: shield, color: green }
inputs:
  config: { description: Path to MCP config (.mcp.json, mcp.json, claude_desktop_config.json), default: .mcp.json }
  mode: { description: "scan (static checks) or check (compare against mcpwatch.lock; run it on a schedule)", default: scan }
  lock: { description: Lock file for check mode, default: mcpwatch.lock }
  fail-on: { description: "scan mode: fail at this severity or above (low|medium|high|critical)", default: high }
runs:
  using: composite
  steps:
    - shell: bash
      env:
        MW_CONFIG: "${{ inputs.config }}"
        MW_MODE: "${{ inputs.mode }}"
        MW_LOCK: "${{ inputs.lock }}"
        MW_FAIL: "${{ inputs.fail-on }}"
        MW_HOME: "${{ github.action_path }}"
      # -I keeps the scanned repo off sys.path (it could ship its own mcpwatch/ to hijack imports).
      # GitHub's bash shell runs with pipefail, so tee does not hide the exit code.
      run: |
        case "$MW_MODE" in
          scan)  python3 -I "$MW_HOME/mcpwatch/scan.py" "$MW_CONFIG" --format md --fail-on "$MW_FAIL" | tee -a "$GITHUB_STEP_SUMMARY" ;;
          check) python3 -I -c 'import sys; sys.path.insert(0, sys.argv[1]); from mcpwatch.watch import main; sys.exit(main(sys.argv[2:]))' \
                   "$MW_HOME" check "$MW_CONFIG" --lock "$MW_LOCK" | sed 's/^/    /' | tee -a "$GITHUB_STEP_SUMMARY" ;;  # indented = literal code block: config names can't inject markdown
          *)     echo "mode must be scan or check" >&2; exit 2 ;;
        esac
