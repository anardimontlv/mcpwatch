name: daily index
on:  # the full scan (registry + probes, ~20 min) runs daily; pushes only re-render pages (pages.yml)
  schedule: [{ cron: "23 4 * * *" }]  # 06:23 Israel; edited to re-register the schedule after the repo rename + force-push
  workflow_dispatch:
    inputs:
      baseline:
        description: "Reset the radar baseline (after probe/rule logic changes): rescan without diffing and drop today's change file"
        type: boolean
        default: false
permissions: { contents: write }
concurrency: { group: publish, cancel-in-progress: false }  # shared with pages.yml: never two publishers at once
jobs:
  gate:  # GitHub's schedule can fire hours late: skip it if today's scan already published (a second one would overwrite today's radar)
    runs-on: ubuntu-latest
    outputs: { run: "${{ steps.c.outputs.run }}" }
    steps:
      - id: c
        env: { GH_TOKEN: "${{ github.token }}", REPO: "${{ github.repository }}", EVENT: "${{ github.event_name }}" }
        run: |
          if [ "$EVENT" = schedule ] && gh api "repos/$REPO/contents/$(date -u +%F).json?ref=history" --silent 2>/dev/null; then
            echo "today's scan already published: skipping"; echo run=false >> "$GITHUB_OUTPUT"
          else echo run=true >> "$GITHUB_OUTPUT"; fi
  build:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - run: python -m unittest -q
      - name: load yesterday's index and the change history
        env: { GH_TOKEN: "${{ github.token }}", REPO: "${{ github.repository }}" }
        run: |
          mkdir -p prev
          git fetch -q origin site && git archive origin/site site/d | tar -x -C prev || echo "no previous site: baseline run"
          git clone -q --depth 1 --branch history --single-branch "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" hist \
            || { mkdir -p hist && git -C hist init -q -b history && git -C hist remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"; }
      - name: index
        env:
          BASELINE: "${{ inputs.baseline }}"
          MCPWATCH_LEGAL_ENTITY: "Amir Nardimon, Israeli sole proprietor, HaHarchava 25, Herut 4069100, Israel"
        run: |
          if [ "$BASELINE" = "true" ]; then
            rm -f "hist/$(date -u +%F).json"
            python -m mcpwatch.index --out site --history hist
          else
            python -m mcpwatch.index --out site --prev prev/site/d --history hist
          fi
      - name: sanity-check output before publishing
        run: |
          python - <<'PY'
          import json; s = json.load(open("site/stats.json"))
          assert s["servers"] > 1000, s  # a broken registry fetch must not wipe the public index
          print(s)
          PY
      - name: radar bot (aggregate daily post; weekly dev.to article on Mondays)
        continue-on-error: true  # social posting must never block publishing
        env:
          BLUESKY_HANDLE: "${{ secrets.BLUESKY_HANDLE }}"
          BLUESKY_APP_PASSWORD: "${{ secrets.BLUESKY_APP_PASSWORD }}"
          MASTODON_INSTANCE: "${{ secrets.MASTODON_INSTANCE }}"
          MASTODON_TOKEN: "${{ secrets.MASTODON_TOKEN }}"
          DEVTO_API_KEY: "${{ secrets.DEVTO_API_KEY }}"
        run: python -m mcpwatch.announce --site site --state hist
      - name: append today's changes to the history branch (kept forever, this is the moat)
        run: |
          cd hist
          git config user.name "mcpwatch-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || { git commit -q -m "changes $(date -u +%F)" && git push -q origin history; }
      - name: publish to the site branch (Vercel deploys it)
        env: { GH_TOKEN: "${{ github.token }}", REPO: "${{ github.repository }}" }
        # orphan commit force-pushed each run: generated data never accumulates in git history
        run: |
          mkdir -p /tmp/pub && cp -r site api vercel.json /tmp/pub/
          cd /tmp/pub
          git init -q -b site
          git config user.name "mcpwatch-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -q -m "index $(date -u +%F)"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" site
      - name: reconcile plans with Paddle (repairs missed webhooks; never fails the job, skips without PADDLE_API_KEY)
        continue-on-error: true
        env:
          DATABASE_URL: "${{ secrets.DATABASE_URL }}"
          PADDLE_API_KEY: "${{ secrets.PADDLE_API_KEY }}"
          PADDLE_ENV: "${{ vars.PADDLE_ENV }}"
          PADDLE_PRICE_PRO: "${{ vars.PADDLE_PRICE_PRO }}"
          PADDLE_PRICE_TEAM: "${{ vars.PADDLE_PRICE_TEAM }}"
        run: python -m mcpwatch.billing_sync
      - name: email watchlist digests (free beta; never fails the job, skips without secrets)
        continue-on-error: true
        env: { DATABASE_URL: "${{ secrets.DATABASE_URL }}", RESEND_API_KEY: "${{ secrets.RESEND_API_KEY }}", BILLING_ENABLED: "${{ vars.BILLING_ENABLED }}" }
        run: python -m mcpwatch.digest --changes site/changes.json
