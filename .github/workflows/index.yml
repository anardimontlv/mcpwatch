name: daily index
on:
  schedule: [{ cron: "17 4 * * *" }]
  workflow_dispatch:
  push: { branches: [main], paths: ["agentguard/**", "tests/**"] }
permissions: { contents: write }
concurrency: { group: index, cancel-in-progress: false }
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python -m unittest -q
      - run: python -m agentguard.index --out site
      - name: commit refreshed site (Vercel deploys on push)
        run: |
          git config user.name "agentguard-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # runs can queue behind each other; move onto the latest main (mixed reset keeps our fresh site/ in the worktree)
          git fetch -q origin main && git reset -q origin/main
          git add site
          git diff --cached --quiet || { git commit -q -m "index: daily refresh $(date -u +%F)" && git push; }
