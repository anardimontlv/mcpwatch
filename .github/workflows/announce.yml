name: announce
# Manual re-run of the radar bot against the published site (no rescan). The daily scan runs it automatically.
on: { workflow_dispatch: {} }
permissions: { contents: write }
concurrency: { group: publish, cancel-in-progress: false }
jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - name: fetch published site data and history markers
        env: { GH_TOKEN: "${{ github.token }}", REPO: "${{ github.repository }}" }
        run: |
          mkdir -p live
          git fetch -q origin site && git archive origin/site site/stats.json site/changes.json | tar -x -C live
          git clone -q --depth 1 --branch history --single-branch "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" hist
      - name: post
        env:
          BLUESKY_HANDLE: "${{ secrets.BLUESKY_HANDLE }}"
          BLUESKY_APP_PASSWORD: "${{ secrets.BLUESKY_APP_PASSWORD }}"
          MASTODON_INSTANCE: "${{ secrets.MASTODON_INSTANCE }}"
          MASTODON_TOKEN: "${{ secrets.MASTODON_TOKEN }}"
          DEVTO_API_KEY: "${{ secrets.DEVTO_API_KEY }}"
        run: python -m mcpwatch.announce --site live/site --state hist
      - name: persist the posted-today marker
        run: |
          cd hist
          git config user.name "mcpwatch-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || { git commit -q -m "announced $(date -u +%F)" && git push -q origin history; }
