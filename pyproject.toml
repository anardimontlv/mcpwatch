[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "mcpwatch"
version = "0.2.0"
description = "Know when the tools your AI agents trust change: MCP config scanner and tool drift checks."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.9"
dependencies = []

[project.urls]
Homepage = "https://www.mcpwatch.io"
Source = "https://github.com/anardimontlv/mcpwatch"

[project.scripts]
mcpwatch = "mcpwatch.watch:main"
mcpwatch-scan = "mcpwatch.scan:main"
mcpwatch-mcp = "mcpwatch.mcp_server:main"

[tool.setuptools]
packages = ["mcpwatch"]
